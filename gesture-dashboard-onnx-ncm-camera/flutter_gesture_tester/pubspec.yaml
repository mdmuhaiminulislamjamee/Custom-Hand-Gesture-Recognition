name: gesture_model_tester
description: Two-hand LiteRT gesture tester for phone and USB-NCM cameras.
publish_to: 'none'
version: 2.0.1+3

environment:
  sdk: ^3.13.7

dependencies:
  camera: 0.12.0+2
  flutter:
    sdk: flutter
  hand_detection:
    path: ../static_gesture_runtime/flutter/third_party/hand_detection
  static_gesture_runtime:
    path: ../static_gesture_runtime/flutter

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

# Keep the native-assets toolchain aligned with the qualified runtime package.
# Flutter 3.47 still pins older support packages for tests, so the compatible
# newer hook stack is selected explicitly here.
dependency_overrides:
  code_assets: 2.1.0
  dartcv4: 2.3.1
  hooks: 2.2.0
  meta: 1.19.0
  record_use: 1.1.1

flutter:
  uses-material-design: true

hooks:
  user_defines:
    dartcv4:
      parallel_jobs: 1
      include_modules:
        - imgcodecs
        - imgproc
